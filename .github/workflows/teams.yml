# One job per team so a pull request shows which team's tests pass.
# (Written for the hackathon; not yet run on GitHub by the author.)
name: team-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: ${{ matrix.team }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        team: [team1-beta, team2-predictive, team3-intervals, team4-map_hpd,
               team5-populations, team6-plot, zz-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::pkgload
      - name: Run this team's tests
        run: |
          install.packages("."  , repos = NULL, type = "source")
          testthat::test_local(".", filter = "${{ matrix.team }}", stop_on_failure = TRUE)
        shell: Rscript {0}
